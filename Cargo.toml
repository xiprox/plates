[workspace]
resolver = "3"
# `src/*` makes every folder under src/ a workspace member, and each experiment is a workspace
# of its own.
members = ["src/*"]
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
