[workspace]
resolver = "3"
# `src/*` makes every folder under src/ a workspace member, and each experiment is a workspace
# of its own.
members = ["src/*"]
exclude = ["experiments"]

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps the keys of Claude Code's settings file in their order when
# `plates hooks install` rewrites it.
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
dirs = "6"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
