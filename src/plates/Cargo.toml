[package]
name = "plates"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
plates-core = { path = "../plates-core" }
serde_json.workspace = true
dirs.workspace = true
async-channel = "2"
# The same pin as the window test's, which is gpui-pre 0.3.12, a weekly snapshot of Zed's gpui
# (record/decisions/001-rust-and-gpui.md).
gpui-kit = "=0.9.1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# 0.62 is the version gpui-pre-windows 0.3.12 uses, so both share one build.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
