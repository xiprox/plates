[package]
name = "plates"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
plates-core = { path = "../plates-core" }
serde_json.workspace = true
dirs.workspace = true
async-channel = "2"
# The same pin as the window test's, which is gpui-pre 0.3.12, a weekly snapshot of Zed's gpui
# (record/decisions/001-rust-and-gpui.md).
gpui-kit = "=0.9.1"
raw-window-handle = "0.6"
# The tray icon on Windows and the menu bar item on macOS, with their menu. It uses the objc2,
# objc2-app-kit, and windows-sys versions GPUI does, so they share one build.
tray-icon = { version = "0.26", default-features = false }
# Reads the tray's icon from the PNG tools/make-icons.mjs writes. 0.18 is the version tray-icon
# uses on macOS.
png = "0.18"
# Installs, updates (with delta packages), and uninstalls. Keep in step with VPK_VERSION in
# .github/workflows/release.yml, as the packages vpk makes are read by this crate.
velopack = "=1.2.161"
# GPUI's test support, which `plates showcase --capture` draws the rack into a picture with. Only
# a build with the `capture` feature has it. The version is gpui-kit's, the same pin as above.
gpui-pre = { version = "=0.3.12", optional = true, features = ["test-support"] }

[features]
# `plates showcase --capture <file.png>` saves a picture of the made-up rack.
capture = ["dep:gpui-pre", "dep:gpui-pre-macos", "dep:gpui-pre-apple"]

[build-dependencies]
# build.rs gives plates.exe its icon.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS window and Metal renderer's halves of GPUI's test support, for the `capture` feature.
gpui-pre-macos = { version = "=0.3.12", optional = true, features = ["test-support"] }
gpui-pre-apple = { version = "=0.3.12", optional = true, features = ["test-support"] }
# The versions gpui-pre-macos 0.3.12 uses, so both share one build.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-application-services = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "AXError",
    "AXUIElement",
    "HIServices",
] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
# 0.62 is the version gpui-pre-windows 0.3.12 uses, so both share one build.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
