[package]
name = "window-test"
version = "0.1.0"
edition = "2024"
publish = false

# An empty workspace table makes this its own workspace, so the product's workspace at the
# repository root never takes it in.
[workspace]

[dependencies]
# The same pin as choom-collector's, which is gpui-pre 0.3.12, a weekly snapshot of Zed's gpui.
gpui-kit = "=0.9.1"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# 0.62 is the version gpui-pre-windows 0.3.12 uses, so both share one build.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"
