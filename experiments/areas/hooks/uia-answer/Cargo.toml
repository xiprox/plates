[package]
name = "uia-answer"
version = "0.1.0"
edition = "2024"
publish = false

# An empty workspace table makes this its own workspace, so the product's workspace at the
# repository root never takes it in.
[workspace]

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# 0.62 is the version the product and the rack's window test build, so all three share one build.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
